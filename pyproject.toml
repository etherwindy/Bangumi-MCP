[project]
name = "Bangumi-MCP"
version = "0.2.0"
description = "MCP server for the Bangumi API (MCP SDK 2.x)"
readme = {file = "README.md", content-type = "text/markdown"}
authors = [
    { name = "etherwindy", email = "1123725603@qq.com" }
]
requires-python = ">=3.10"
dependencies = [
    "httpx[socks]>=0.28.1",
    "mcp>=2.3.0,<3",
    "pydantic>=2.12.0",
    "python-dotenv>=1.1.1",
]

[project.scripts]
bangumi-mcp = "bangumi_mcp.__main__:main"

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bangumi_mcp*"]

[tool.setuptools.package-data]
bangumi_mcp = ["*.json"]

[dependency-groups]
dev = [
    "anyio>=4.9",
    "pytest>=8.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
